name: Daily Intelligence Update
on:
  schedule:
    # 22:00 UTC previous day = 06:00 Asia/Kuala_Lumpur (UTC+8)
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install
      - name: Generate daily JSON
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SIN_CHEW_RSS_URL: ${{ vars.SIN_CHEW_RSS_URL }}
          NANYANG_RSS_URL: ${{ vars.NANYANG_RSS_URL }}
          FOODNAVIGATOR_RSS_URL: ${{ vars.FOODNAVIGATOR_RSS_URL }}
        run: node scripts/generate-daily.mjs
      - name: Publish history
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add data/ && (git diff --cached --quiet || git commit -m 'chore: publish daily intelligence') && git push

